name: XHSCopywriter
options:
  bundleIdPrefix: com.xhs
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "16.0"

settings:
  SWIFT_VERSION: "6"
  DEVELOPMENT_TEAM: ""

targets:
  XHSCopywriter:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.xhs.copywriter
      INFOPLIST_FILE: Sources/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: "红书文案"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
